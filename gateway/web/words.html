<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#2f6feb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="/icons/icon-180.png">

<title>词库 · English Study</title>
<style>
:root{--bg:#f7f8fa;--card:#fff;--line:#e6e8ee;--tx:#1c1f26;--mut:#6b7280;--acc:#2f6feb;--ok:#12a150}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.55 ui-sans-serif,system-ui,"Segoe UI",sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:24px 18px 70px}
header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:17px;margin:0;font-weight:650}
input,select,button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 11px;font-size:13px;color:var(--tx)}
input{min-width:220px}
button{cursor:pointer}
a.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 11px;text-decoration:none;color:var(--tx);font-size:13px}
.ml{margin-left:auto;display:flex;gap:8px;align-items:center}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{padding:9px 12px;text-align:left;font-size:13px;border-bottom:1px solid #f0f2f6;vertical-align:top}
th{background:#fafbfd;font-size:12px;color:var(--mut);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:none}
.w{font-weight:650;white-space:nowrap}
.s{color:var(--mut);font-size:12px;max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{font-size:11.5px;padding:2px 7px;border-radius:6px;background:#f1f4fb;color:#2f4faf;white-space:nowrap}
.st.learned{background:#eafaf1;color:#1a6b43}
.del{color:#c33;background:none;border:none;cursor:pointer;font-size:12px}
.empty{text-align:center;color:var(--mut);padding:40px 0}
.spk{border:none;background:none;cursor:pointer;font-size:13px}

@media (max-width: 640px){.wrap{padding:16px 12px 60px} input{min-width:0;width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>词库</h1>
    <input id="q" placeholder="搜索单词或释义…">
    <select id="status">
      <option value="all">全部</option>
      <option value="learning">学习中</option>
      <option value="learned">已掌握</option>
    </select>
    <div class="ml">
      <span id="cnt" style="font-size:12px;color:var(--mut)"></span>
      <a class="btn" href="/api/export.csv">导出 CSV</a>
      <a class="btn" href="/">看板</a>
      <a class="btn" href="/review">复习</a>
    </div>
  </header>
  <div id="list"></div>
</div>
<script>
const $ = id => document.getElementById(id);
let t = null;
async function load(){
  const q = encodeURIComponent($('q').value.trim());
  const st = $('status').value;
  const r = await fetch('/api/words?q=' + q + '&status=' + st);
  const d = await r.json();
  $('cnt').textContent = d.count + ' 个';
  if(!d.items.length){ $('list').innerHTML = '<div class="empty">还没有词。在 YouTube 字幕里点一个生词，选「保存」。</div>'; return; }
  const rows = d.items.map(w=>`
    <tr>
      <td><span class="w">${w.lemma}</span> <button class="spk" data-w="${w.lemma}">🔊</button><div style="color:var(--mut);font-size:12px">${w.phonetic||''}</div></td>
      <td>${(w.meaning||'').replace(/</g,'&lt;')}${w.cefr?` <span class="st">${w.cefr}</span>`:''}${w.morphology?`<div style="color:#8b93a5;font-size:11.5px;margin-top:3px">${(w.morphology||'').replace(/</g,'&lt;')}</div>`:''}</td>
      <td class="s" title="${(w.sentence||'').replace(/"/g,'&quot;')}">${(w.sentence||'').replace(/</g,'&lt;')}</td>
      <td><span class="st ${w.status}">${w.status==='learned'?'已掌握':'学习中'}</span></td>
      <td>${w.reps} / ${w.interval}天</td>
      <td><button class="del" data-lemma="${w.lemma}">删除</button></td>
    </tr>`).join('');
  $('list').innerHTML = `<table><thead><tr><th>词</th><th>释义</th><th>原句</th><th>状态</th><th>复习/间隔</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
  document.querySelectorAll('.spk').forEach(b=>b.onclick=()=>{ const u=new SpeechSynthesisUtterance(b.dataset.w); u.lang='en-GB'; u.rate=.9; speechSynthesis.speak(u); });
  document.querySelectorAll('.del').forEach(b=>b.onclick=async()=>{
    if(!confirm('删除 ' + b.dataset.lemma + ' ?')) return;
    await fetch('/api/words/remove',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lemma:b.dataset.lemma})});
    load();
  });
}
$('q').oninput = ()=>{ clearTimeout(t); t = setTimeout(load, 220); };
$('status').onchange = load;
load().catch(e=>{ $('list').innerHTML = '<div class="empty">连不上本地网关（先运行 start-gateway.cmd）</div>'; });
</script>

<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{});}</script>
</body>
</html>
