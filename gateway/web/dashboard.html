<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- 独立看板已停用：看板已内置到 dsh-english-study 插件，PWA 入口移除 -->
<meta name="theme-color" content="#2f6feb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="/icons/icon-180.png">

<title>English Study 看板</title>
<style>
:root{--bg:#f7f8fa;--card:#fff;--line:#e6e8ee;--tx:#1c1f26;--mut:#6b7280;--acc:#2f6feb;--ok:#12a150;--warn:#d97706}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.55 ui-sans-serif,system-ui,"Segoe UI",sans-serif}
html,body{max-width:100%;overflow-x:hidden}
.wrap{max-width:1080px;margin:0 auto;padding:24px 20px 60px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:19px;margin:0;font-weight:650}
.tag{font-size:12px;color:var(--mut)}
.nav{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;min-width:0}
a.btn,button.btn{border:1px solid var(--line);background:var(--card);color:var(--tx);padding:7px 12px;border-radius:8px;text-decoration:none;font-size:13px;cursor:pointer}
a.btn:hover,button.btn:hover{border-color:#c9cdd6}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{filter:brightness(1.05)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.kpi .lab{font-size:12px;color:var(--mut)}
.kpi .val{font-size:24px;font-weight:680;margin-top:4px;letter-spacing:-.5px}
.kpi .sub{font-size:11.5px;color:var(--mut);margin-top:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.panel h2{font-size:13.5px;margin:0 0 12px;font-weight:640;display:flex;align-items:center;gap:8px}
.panel h2 .hint{font-weight:400;color:var(--mut);font-size:11.5px}
.row2{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}
canvas{width:100%;height:150px;display:block}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:12px;height:12px;border-radius:2px;background:#eceef3;display:block}
.top{display:flex;flex-wrap:wrap;gap:6px}
.top span{background:#f1f4fb;color:#2f4faf;border-radius:7px;padding:4px 9px;font-size:12px}
.top span b{font-weight:700}
.lk{max-height:340px;overflow:auto}
.lk h3{font-size:12px;color:var(--mut);margin:14px 0 6px;font-weight:600;position:sticky;top:0;background:var(--card);padding:4px 0}
.lk .it{display:flex;gap:10px;padding:5px 0;border-bottom:1px dashed #eef0f4;font-size:13px}
.lk .w{min-width:120px;font-weight:600}
.lk .s{color:var(--mut);font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lk .t{color:#9aa1ad;font-size:11.5px}
.empty{color:var(--mut);font-size:13px;padding:10px 0}
.foot{color:#9aa1ad;font-size:11.5px;margin-top:18px}
.dot{width:8px;height:8px;border-radius:50%;background:#ccc;display:inline-block}
.dot.on{background:var(--ok)}

@media (max-width: 640px){
  .wrap{padding:14px 12px 56px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .nav{width:100%;margin-left:0;justify-content:flex-start}
  .kpi .val{font-size:19px}
  .kpi .sub{font-size:11px}
  .row2{grid-template-columns:1fr}
  h1{font-size:17px}
  .nav a.btn,.nav button.btn{padding:6px 9px;font-size:12px}
  .kpi .val{font-size:20px}
  .panel{padding:13px}
  .heat{grid-template-rows:repeat(7,10px)}
  .heat i{width:10px;height:10px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>English Study</h1>
    <span class="tag"><span class="dot" id="dot"></span> <span id="aiState">连接中…</span></span>
    <div class="nav">
      <a class="btn pri" href="/review">复习 <span id="dueNav"></span></a>
      <a class="btn" href="/words">词库</a>
      <a class="btn" href="/sentences">句子</a>
      <a class="btn" href="/dictation">听写</a>
      <a class="btn" href="/report">周报</a>
      <a class="btn" href="/api/export.csv">导出 CSV</a>
    </div>
  </header>

  <div class="grid">
    <div class="kpi"><div class="lab">今日沉浸</div><div class="val" id="kImm">0 分</div><div class="sub" id="kGoal">目标 30 分钟</div></div>
    <div class="kpi"><div class="lab">今日查词</div><div class="val" id="kLk">0</div><div class="sub" id="kLkSub">其中 0 个不同词</div></div>
    <div class="kpi"><div class="lab">今日新增生词</div><div class="val" id="kNew">0</div><div class="sub" id="kTotal">词库共 0 个</div></div>
    <div class="kpi"><div class="lab">待复习</div><div class="val" id="kDue">0</div><div class="sub" id="kStreak">连续 0 天</div></div>
  </div>

  <div class="row2">
    <div class="panel">
      <h2>近 14 天 <span class="hint">柱=沉浸分钟　折线=新增生词</span></h2>
      <canvas id="chart"></canvas>
    </div>
    <div class="panel">
      <h2>高频查词 <span class="hint">近 30 天</span></h2>
      <div class="top" id="topWords"><div class="empty">还没有查词记录</div></div>
    </div>
  </div>

  <div class="panel">
    <h2>打卡热力图 <span class="hint">近 120 天（越深越活跃）</span></h2>
    <div class="heat" id="heat"></div>
  </div>

  <div class="panel">
    <h2>查词记录 <span class="hint">每天搜过的词都在这里</span></h2>
    <div class="lk" id="lookups"><div class="empty">加载中…</div></div>
  </div>

  <div class="foot">数据全部存在本机 <code>data/english-study.db</code>；AI 解释是可选的（自己配 <code>ES_API</code> + <code>ES_KEY</code>），回答会缓存，同一个词+同一句不会重复收费。<br><span id="aiUse"></span></div>
</div>

<script>
const $ = id => document.getElementById(id);
const fmtMin = s => (s/60) >= 60 ? (s/3600).toFixed(1)+' 小时' : Math.round(s/60)+' 分';

async function jget(u){ const r = await fetch(u); if(!r.ok) throw new Error(await r.text()); return r.json(); }

async function boot(){
  try{
    const h = await jget('/api/health');
    $('dot').classList.add('on');
    $('aiState').textContent = h.ai ? ('本地网关已连接 · ' + h.model) : '本地网关已连接（纯本地词典模式，未配 AI）';
  }catch(e){ $('aiState').textContent = '网关未启动（运行 start-gateway.cmd）'; }
  const s = await jget('/api/stats');
  $('kImm').textContent = fmtMin(s.today.immersion_sec);
  $('kGoal').textContent = '目标 ' + s.goal_minutes + ' 分钟';
  $('kLk').textContent = s.today.lookups;
  $('kLkSub').textContent = '其中 ' + s.today.distinct_words + ' 个不同词';
  $('kNew').textContent = s.today.saved;
  $('kTotal').textContent = '词库共 ' + s.totals.saved + ' 个（已掌握 ' + s.totals.learned + '）';
  $('kDue').textContent = s.totals.due;
  $('kStreak').textContent = '连续 ' + s.totals.streak + ' 天';
  $('dueNav').textContent = s.totals.due ? '(' + s.totals.due + ')' : '';
  drawChart(s.series);
  drawTop(s.top);
  drawHeat(s.heat);
  loadLookups();
  if (s.ai) {
    const a = s.ai.today;
    $('aiUse').textContent = '今日 AI：' + a.calls + ' 次请求 · ' + (a.in + a.out) + ' tokens · 约 ¥' + a.cost_cny +
      '（累计 ' + s.ai.total.calls + ' 次 · 约 ¥' + s.ai.total.cost_cny + '）';
  }
}

function drawChart(series){
  const c = $('chart'), dpr = window.devicePixelRatio || 1;
  const W = c.clientWidth, H = 150; c.width = W*dpr; c.height = H*dpr;
  const g = c.getContext('2d'); g.scale(dpr,dpr); g.clearRect(0,0,W,H);
  const pad = {l:34,r:10,t:10,b:22};
  const iw = W-pad.l-pad.r, ih = H-pad.t-pad.b;
  const maxMin = Math.max(30, ...series.map(x=>x.seconds/60));
  const maxW = Math.max(3, ...series.map(x=>x.words));
  g.strokeStyle = '#eef0f4'; g.lineWidth = 1;
  for(let i=0;i<=3;i++){ const y = pad.t + ih*i/3; g.beginPath(); g.moveTo(pad.l,y); g.lineTo(W-pad.r,y); g.stroke(); }
  const bw = iw/series.length*0.55;
  series.forEach((d,i)=>{
    const x = pad.l + iw*(i+0.5)/series.length;
    const h = ih * (d.seconds/60) / maxMin;
    g.fillStyle = '#c9d8ff';
    g.fillRect(x-bw/2, pad.t+ih-h, bw, h);
    if(i%2===0){ g.fillStyle='#9aa1ad'; g.font='10px system-ui'; g.textAlign='center'; g.fillText(d.day.slice(5), x, H-8); }
  });
  g.beginPath(); g.strokeStyle = '#2f6feb'; g.lineWidth = 2;
  series.forEach((d,i)=>{ const x = pad.l+iw*(i+0.5)/series.length; const y = pad.t+ih-ih*(d.words/maxW); i?g.lineTo(x,y):g.moveTo(x,y); });
  g.stroke();
  g.fillStyle='#9aa1ad'; g.font='10px system-ui'; g.textAlign='right';
  g.fillText(Math.round(maxMin)+'m', pad.l-6, pad.t+8);
}

function drawTop(top){
  const el = $('topWords');
  if(!top.length){ return; }
  el.innerHTML = top.map(t=>`<span>${t.lemma} <b>${t.n}</b></span>`).join('');
}

function drawHeat(heat){
  const el = $('heat'); el.innerHTML='';
  const days = [];
  const now = new Date();
  for(let i=119;i>=0;i--){ const d = new Date(now.getTime()-i*86400000); days.push(d); }
  const max = Math.max(600, ...Object.values(heat||{}));
  days.forEach(d=>{
    const key = d.toISOString().slice(0,10);
    const v = (heat||{})[key] || 0;
    const a = v ? Math.min(1, 0.18 + 0.82*(v/max)) : 0;
    const i = document.createElement('i');
    i.title = key + ' · ' + (v? Math.round(v/60)+' 分':'无记录');
    i.style.background = v ? `rgba(47,111,235,${a.toFixed(2)})` : '#eceef3';
    el.appendChild(i);
  });
}

async function loadLookups(){
  const data = await jget('/api/lookups?days=7');
  const el = $('lookups');
  const keys = Object.keys(data.days).sort().reverse();
  if(!keys.length){ el.innerHTML = '<div class="empty">最近 7 天还没有查词。打开 YouTube 视频，开启字幕后点字幕里的词试试。</div>'; return; }
  el.innerHTML = keys.map(day=>{
    const items = data.days[day].slice(0,60).map(it=>{
      const t = new Date(it.ts*1000).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
      const sent = (it.sentence||'').replace(/</g,'&lt;');
      return `<div class="it"><span class="w">${(it.lemma||it.word)}</span><span class="s" title="${sent}">${sent}</span><span class="t">${t}</span></div>`;
    }).join('');
    return `<h3>${day}（${data.days[day].length} 次）</h3>${items}`;
  }).join('');
}

boot().catch(e=>{ console.error(e); });
</script>

<script>/* 独立看板已停用：不再注册 service worker */</script>
</body>
</html>
