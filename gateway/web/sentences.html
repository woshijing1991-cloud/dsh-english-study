<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#2f6feb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="/icons/icon-180.png">

<title>句子收藏 · English Study</title>
<style>
:root{--bg:#f7f8fa;--card:#fff;--line:#e6e8ee;--tx:#1c1f26;--mut:#6b7280;--acc:#2f6feb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.6 ui-sans-serif,system-ui,"Segoe UI",sans-serif}
.wrap{max-width:920px;margin:0 auto;padding:24px 18px 70px}
header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:17px;margin:0;font-weight:650}
input{min-width:240px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 11px;font-size:13px}
a.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 11px;text-decoration:none;color:var(--tx);font-size:13px}
.ml{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.en{font-size:16px;line-height:1.6}
.zh{color:var(--mut);font-size:13.5px;margin-top:6px}
.meta{display:flex;gap:10px;align-items:center;margin-top:8px;font-size:11.5px;color:#9aa1ad}
.meta button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:3px 8px;font-size:11.5px;cursor:pointer}
.meta .del{color:#c33;border-color:#f0d5d5}
.empty{text-align:center;color:var(--mut);padding:50px 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>句子收藏</h1>
    <input id="q" placeholder="搜索原句或译文…">
    <div class="ml"><span id="cnt"></span><a class="btn" href="/">看板</a><a class="btn" href="/dictation">听写</a></div>
  </header>
  <div id="list"></div>
</div>
<script>
const $ = id => document.getElementById(id);
let t = null;
function esc(s){ return String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
async function load(){
  const r = await fetch('/api/sentences?q=' + encodeURIComponent($('q').value.trim()));
  const d = await r.json();
  $('cnt').textContent = d.count + ' 句';
  if(!d.items.length){ $('list').innerHTML = '<div class="empty">还没有收藏句子。在 YouTube 字幕条上点「收藏句子」，或到<a href="/">看板</a>看看。</div>'; return; }
  $('list').innerHTML = d.items.map(s=>`
    <div class="card">
      <div class="en">${esc(s.text)}</div>
      ${s.translation?`<div class="zh">${esc(s.translation)}</div>`:''}
      <div class="meta">
        ${s.video?`<span>${esc(s.video)}</span>`:''}<span>${s.day||''}</span>
        <button data-say="${esc(s.text)}">🔊 朗读</button>
        <button data-copy="${esc(s.text)}">复制</button>
        <button data-tr="${esc(s.text)}" data-id="${s.id}">补翻译</button>
        <button class="del" data-id="${s.id}">删除</button>
      </div>
    </div>`).join('');
  document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>{ const u=new SpeechSynthesisUtterance(b.dataset.say); u.lang='en-GB'; u.rate=.9; speechSynthesis.speak(u); });
  document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{ navigator.clipboard.writeText(b.dataset.copy); b.textContent='已复制'; setTimeout(()=>b.textContent='复制',1000); });
  document.querySelectorAll('[data-tr]').forEach(b=>b.onclick=async()=>{
    b.textContent='翻译中…';
    const t = await (await fetch('/api/translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sentence:b.dataset.tr})})).json();
    await fetch('/api/sentences/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:b.dataset.tr, translation:t.translation})});
    load();
  });
  document.querySelectorAll('.del').forEach(b=>b.onclick=async()=>{
    if(!confirm('删除这句？')) return;
    await fetch('/api/sentences/remove',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:+b.dataset.id})});
    load();
  });
}
$('q').oninput=()=>{ clearTimeout(t); t=setTimeout(load,220); };
load().catch(()=>{ $('list').innerHTML='<div class="empty">连不上本地网关（先运行 start-gateway.cmd）</div>'; });
</script>

<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{});}</script>
</body>
</html>
