<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#2f6feb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="/icons/icon-180.png">

<title>复习 · English Study</title>
<style>
:root{--bg:#f7f8fa;--card:#fff;--line:#e6e8ee;--tx:#1c1f26;--mut:#6b7280;--acc:#2f6feb;--ok:#12a150;--bad:#d93a3a;--warn:#d97706}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.6 ui-sans-serif,system-ui,"Segoe UI",sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:26px 18px 80px}
header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
h1{font-size:17px;margin:0;font-weight:650}
.bar{margin-left:auto;font-size:12px;color:var(--mut)}
.prog{height:4px;background:#e8ebf1;border-radius:4px;overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;background:var(--acc);width:0;transition:width .25s}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px 22px;margin-bottom:14px}
.word{font-size:32px;font-weight:700;letter-spacing:-.5px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pho{font-size:14px;color:var(--mut);font-weight:400}
.spk{border:1px solid var(--line);background:#fff;border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:14px}
.sent{color:var(--mut);font-size:13.5px;margin-top:8px;padding-left:10px;border-left:2px solid #dde3ee}
.answer{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px;display:none}
.answer.on{display:block}
.kv{display:grid;grid-template-columns:64px 1fr;gap:6px 10px;font-size:13.5px;margin-bottom:8px}
.kv .k{color:var(--mut);font-size:12px}
.cta{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
button.big{flex:1;min-width:120px;padding:12px 0;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:14px;cursor:pointer}
button.big.again{border-color:#f0c9c9;color:var(--bad)}
button.big.good{border-color:#c9d8ff;color:var(--acc)}
button.big.easy{border-color:#c3e8d4;color:var(--ok)}
button.big:hover{filter:brightness(.98)}
.empty{text-align:center;color:var(--mut);padding:40px 0}
a{color:var(--acc);text-decoration:none}
.hint{font-size:12px;color:var(--mut);margin-top:10px}

@media (max-width: 640px){.wrap{padding:16px 12px 60px} input{min-width:0;width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>复习</h1>
    <div class="bar"><span id="cnt">加载中…</span> · <a href="/">回看板</a></div>
  </header>
  <div class="prog"><i id="prog"></i></div>
  <div id="stage"></div>
  <div class="hint">空格 = 显示答案；1 忘了 / 2 一般 / 3 简单</div>
</div>
<script>
const $ = id => document.getElementById(id);
let queue = [], idx = 0, revealed = false, done = 0;

function say(w){
  try{ const u = new SpeechSynthesisUtterance(w); u.lang='en-GB'; u.rate=.9; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){}
}

function render(){
  const st = $('stage');
  if(idx >= queue.length){
    st.innerHTML = '<div class="card"><div class="empty">这一轮复习完了（' + done + ' 个）。<br><br><a href="/">回看板</a> · <a href="/review">再来一轮</a></div></div>';
    $('cnt').textContent = '完成'; $('prog').style.width = '100%';
    return;
  }
  const w = queue[idx];
  revealed = false;
  $('cnt').textContent = (idx+1) + ' / ' + queue.length;
  $('prog').style.width = (idx/queue.length*100).toFixed(1) + '%';
  st.innerHTML = `
    <div class="card">
      <div class="word">${w.lemma}<span class="pho">${w.phonetic||''}</span><button class="spk" id="spk">🔊</button></div>
      ${w.sentence?`<div class="sent">${esc(w.sentence)}</div>`:''}
      <div class="answer" id="ans">
        <div class="kv"><div class="k">释义</div><div>${esc(w.meaning||'—')}</div></div>
        ${w.in_context?`<div class="kv"><div class="k">语境</div><div>${esc(w.in_context)}</div></div>`:''}
        ${w.collocations?`<div class="kv"><div class="k">搭配</div><div>${esc(w.collocations)}</div></div>`:''}
        ${w.example?`<div class="kv"><div class="k">例句</div><div>${esc(w.example)}</div></div>`:''}
        ${w.morphology?`<div class="kv"><div class="k">词根</div><div>${esc(w.morphology)}</div></div>`:''}
        ${w.note?`<div class="kv"><div class="k">提示</div><div>${esc(w.note)}</div></div>`:''}
        <div class="kv"><div class="k">进度</div><div>复习 ${w.reps} 次 · 遗忘 ${w.lapses} 次 · 间隔 ${w.interval} 天</div></div>
      </div>
      <div class="cta" id="cta"><button class="big good" id="show">显示答案（空格）</button></div>
    </div>`;
  $('spk').onclick = ()=>say(w.lemma);
  $('show').onclick = reveal;
}
function esc(s){ return String(s||'').replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function reveal(){
  if(revealed) return;
  revealed = true;
  $('ans').classList.add('on');
  $('cta').innerHTML = '<button class="big again" data-g="again">忘了 (1)</button><button class="big good" data-g="good">一般 (2)</button><button class="big easy" data-g="easy">简单 (3)</button>';
  $('cta').querySelectorAll('button').forEach(b=>b.onclick=()=>grade(b.dataset.g));
}
async function grade(g){
  const w = queue[idx];
  try{
    await fetch('/api/review/grade', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id:w.id, grade:g})});
  }catch(e){}
  done++; idx++; render();
}
document.addEventListener('keydown', e=>{
  if(e.code === 'Space'){ e.preventDefault(); reveal(); }
  if(revealed && ['1','2','3'].includes(e.key)) grade({1:'again',2:'good',3:'easy'}[e.key]);
});

(async()=>{
  try{
    const r = await fetch('/api/review/due?limit=60'); const d = await r.json();
    queue = d.items || [];
    if(!queue.length){ $('stage').innerHTML = '<div class="card"><div class="empty">现在没有到期该复习的词。<br><br><a href="/">回看板</a> · <a href="/words">去词库</a></div></div>'; $('cnt').textContent='0'; return; }
    render();
  }catch(e){ $('stage').innerHTML = '<div class="card"><div class="empty">连不上本地网关（先运行 start-gateway.cmd）</div></div>'; }
})();
</script>

<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{});}</script>
</body>
</html>
